services:
  # Unified Web Service (Backend API + Production React Frontend)
  # The frontend (client/dist) is served by the Express backend on the same origin.
  # So no separate CLIENT_URL is needed — same-origin requests don't need CORS headers.
  - type: web
    name: sweety-tracker
    runtime: node
    plan: free
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # CLIENT_URL is set to the Render service URL (same origin as API in production).
      # Update this after first deploy with your actual Render URL.
      - key: CLIENT_URL
        value: https://sweety-tracker.onrender.com
